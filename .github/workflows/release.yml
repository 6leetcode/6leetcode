on:
  push:
    tags:
      - "v*"

name: Create Release

jobs:
  build:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Build binaries
        run: |
          cd apps/cli
          mkdir -p dist
          for target in bun-linux-x64 bun-linux-arm64 bun-darwin-x64 bun-darwin-arm64 bun-windows-x64; do
            ext=""
            case "$target" in bun-windows-*) ext=".exe";; esac
            bun build --compile --minify --target="$target" \
              --define "LEET_VERSION=\"${GITHUB_REF_NAME}\"" \
              --outfile "dist/leet-${target}${ext}" src/index.ts
          done
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: apps/cli/dist/*
