name: Server Build CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  leetcode-server:
    name: leetcode-server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Build server
        run: |
          cd apps/cli
          make build
  leetcode-fe:
    name: leetcode-fe
    runs-on: ubuntu-20.04
    strategy:
      matrix:
        node: ["18"]
    steps:
      - name: Checkout branch
        uses: actions/checkout@v2
        with:
          fetch-depth: 0
          lfs: true
      - name: Setup node
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node }}
          cache: "yarn"
          cache-dependency-path: "apps/web/yarn.lock"
      - name: Build frontend
        run: |
          cd apps/web
          yarn install --frozen-lockfile
          yarn run build
