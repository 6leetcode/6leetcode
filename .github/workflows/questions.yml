# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: Solution Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  solution-check:
    name: solution-check
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        solution:
          - "c"
          - "cc"
          - "golang"
          - "java"
          - "typescript"
          - "python"
          - "rust"
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true
      - name: Test code in specific image
        run: make ${{ matrix.solution }}
