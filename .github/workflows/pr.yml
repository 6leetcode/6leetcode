# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: Generate Questions

on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

jobs:
  create-pull-request:
    name: create-pull-request
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        bun: ["latest"]
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true
      - name: Config git
        run: |
          git config user.name 'Tosone'
          git config user.email 'i@tosone.cn'
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - name: Cache bun
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            apps/cli/node_modules
          key: ${{ runner.os }}-bun-${{ matrix.bun }}-${{ hashFiles('apps/cli/bun.lock', 'apps/cli/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ matrix.bun }}-
            ${{ runner.os }}-bun-
      - name: Build cli
        run: |
          cd apps/cli
          bun install --frozen-lockfile
          bun run build
      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - name: Generate questions
        run: |
          ./apps/cli/bin/leet all
          if [ -n "$(git status --untracked-files=no --porcelain)" ]; then
            git add .
            git commit -S -m "chore(questions): regenerate"
          fi
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.PAT }}
          branch: generate-questions
          branch-suffix: timestamp
          title: "chore(questions): regenerate"
